name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - preprod
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/933433206162/locations/global/workloadIdentityPools/pool-github/providers/github'
          service_account: 'github-actions-ci-cd@pimp-my-track-app.iam.gserviceaccount.com'
          create_credentials_file: true
          token_format: 'access_token'

      - name: Login to Google Container Registry
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: gcr.io/pimp-my-track-app/streamlit-app:${{ github.sha }}

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/develop'
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: 'pimp-my-track-dev'
          image: gcr.io/pimp-my-track-app/streamlit-app:${{ github.sha }}

      - name: Deploy to Preprod
        if: github.ref == 'refs/heads/preprod'
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: 'pimp-my-track-preprod'
          image: gcr.io/pimp-my-track-app/streamlit-app:${{ github.sha }}

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: 'pimp-my-track'
          image: gcr.io/pimp-my-track-app/streamlit-app:${{ github.sha }}